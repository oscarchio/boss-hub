<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>逐字校对台 · 老板成长中枢</title>
<style>
  body { font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; background: #0f1216; color: #e8e8e8; margin: 0; padding: 16px; max-width: 900px; margin: 0 auto; }
  h1 { font-size: 19px; } h1 small { color: #888; font-size: 12px; font-weight: normal; }
  .bar { margin: 10px 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  select, button { background: #1c2330; color: #e8e8e8; border: 1px solid #333; border-radius: 8px; padding: 8px 12px; font-size: 14px; }
  button { cursor: pointer; }
  button:hover { background: #263145; }
  #doc { line-height: 2.4; font-size: 19px; background: #161b23; border-radius: 12px; padding: 18px; margin-top: 12px; }
  .ch { cursor: pointer; border-radius: 4px; padding: 1px 0; }
  .ch:hover { background: #2a3648; }
  .ch.mark { background: #b58900; color: #111; }
  .ch.err { background: #8b2e2e; color: #fff; }
  #side { position: fixed; right: 0; top: 0; width: 260px; height: 100vh; background: #12161d; border-left: 1px solid #2a2f38; padding: 14px; overflow-y: auto; display: none; }
  #side.on { display: block; }
  .tip { color: #8899aa; font-size: 12.5px; }
  #marks div { padding: 6px 4px; border-bottom: 1px solid #222; font-size: 14px; }
  .jyut { color: #7ec8a9; }
  @media (max-width: 720px) { #side { width: 100%; height: 45vh; top: auto; bottom: 0; } }
</style>
</head>
<body>
<h1>逐字校对台 <small>听住播报 · 唔啱就点只字</small></h1>
<div class="bar">
  <select id="src"></select>
  <button id="btnLoad">载入文稿</button>
  <button id="btnExport">导出标注</button>
  <span class="tip">点字=标黄（疑错）；再点=取消。导出后发畀秘书即入白名单评审。</span>
</div>
<div id="doc" class="tip">拣一份稿开始。</div>
<div id="side"><b>标注清单</b><div id="marks"></div></div>
<script>
const $ = s => document.querySelector(s);
let dict = {}, marks = [];
async function boot() {
  try {
    const d = await (await fetch('yue-dict-slim.json?_=' + Date.now())).json();
    dict = d;
  } catch (e) {}
  // 文稿清单（广播稿自动入列）
  try {
    const bc = await (await fetch('broadcasts.json?_=' + Date.now())).json();
    bc.items.filter(i => i.audio).forEach(i => {
      const o = document.createElement('option');
      o.value = i.date + '|' + i.meal;
      o.textContent = `${i.date} ${i.meal}`;
      $('#src').appendChild(o);
    });
  } catch (e) {}
}
function stripHtml(h) { const t = document.createElement('div'); t.innerHTML = h; return t.innerText; }
$('#btnLoad').onclick = async () => {
  const [date, meal] = $('#src').value.split('|');
  const bc = await (await fetch('broadcasts.json?_=' + Date.now())).json();
  const it = bc.items.find(i => i.date === date && i.meal === meal);
  if (!it) return;
  const txt = stripHtml(it.html);
  const doc = $('#doc'); doc.innerHTML = '';
  [...txt].forEach((c, i) => {
    const sp = document.createElement('span');
    sp.className = 'ch'; sp.textContent = c; sp.dataset.i = i;
    sp.onclick = () => {
      sp.classList.toggle('mark');
      const ch = c;
      if (sp.classList.contains('mark')) {
        marks.push({ ch, i, jyut: dict[ch] || '' });
      } else {
        marks = marks.filter(m => m.i !== i);
      }
      renderMarks();
    };
    doc.appendChild(sp);
  });
  $('#side').classList.add('on');
};
function renderMarks() {
  $('#marks').innerHTML = marks.map(m =>
    `<div><b>${m.ch}</b> <span class="jyut">${m.jyut || '（字典未收）'}</span></div>`).join('') || '<div class="tip">未标任何字</div>';
}
$('#btnExport').onclick = () => {
  const blob = new Blob([JSON.stringify({ ts: new Date().toISOString(), src: $('#src').value, marks }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '校对标注.json';
  a.click();
};
boot();
</script>
</body>
</html>
